<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication Successful — LiteDaemon</title>
  <link rel="icon" type="image/png" href="assets/icon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #3D5AFE;
      --blue-deep: #2541E8;
      --blue-pale: #EEF1FF;
      --gray-900: #0F0F1A;
      --gray-600: #4B5563;
      --gray-400: #9CA3AF;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: radial-gradient(circle at 50% 20%, #F5F7FF 0%, #FFFFFF 100%);
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid rgba(61, 90, 254, 0.12);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(61, 90, 254, 0.08), 0 2px 8px rgba(0, 0, 0, 0.03);
      position: relative;
      animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .icon-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: linear-gradient(135deg, #EEF1FF 0%, #E0E7FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .check-svg {
      width: 36px;
      height: 36px;
      stroke: var(--blue);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.2s forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 28px;
      border: 2px solid var(--blue);
      opacity: 0;
      animation: pulse 1.8s ease-out 0.4s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
      color: var(--gray-900);
    }

    p.desc {
      font-size: 15px;
      color: var(--gray-600);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      background: var(--blue);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(61, 90, 254, 0.25);
      user-select: none;
    }

    .btn:hover {
      background: var(--blue-deep);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(61, 90, 254, 0.35);
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(61, 90, 254, 0.2);
    }

    kbd {
      display: inline-block;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--gray-900);
      background-color: #F3F4F6;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      box-shadow: inset 0 -1px 0 #9CA3AF;
    }

    .notice {
      margin-top: 20px;
      font-size: 13px;
      color: var(--gray-400);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">
      <div class="pulse-ring"></div>
      <svg class="check-svg" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 id="status-title">Authentication Successful</h1>
    <p class="desc" id="status-desc">Connecting to LiteDaemon desktop app…</p>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
      <button class="btn" id="action-btn" onclick="handleButtonClick()">Close Tab & Open LiteDaemon</button>
      <a href="#" id="open-app-link" style="color: var(--gray-600); font-size: 14px; text-decoration: underline; display: none;">Didn't open? Click here to launch LiteDaemon</a>
    </div>

    <p class="notice" id="close-notice">You can safely close this browser window.</p>
  </div>

  <script>
    var deepLink = '';

    function handleButtonClick() {
      var btn = document.getElementById('action-btn');
      btn.style.transform = 'scale(0.96)';
      btn.textContent = 'Launching LiteDaemon…';

      // 1. Attempt all browser tab closing methods
      try { window.opener = window; window.close(); } catch(e) {}
      try { window.open('', '_self', ''); window.close(); } catch(e) {}
      try { window.close(); } catch(e) {}
      try { self.close(); } catch(e) {}

      // 2. Bring LiteDaemon to the foreground in Windows via protocol
      if (deepLink) {
        window.location.href = deepLink;
      }

      // 3. Clear interactive state update
      setTimeout(function() {
        btn.style.transform = 'none';
        btn.style.background = '#10B981'; // Emerald green success
        btn.style.boxShadow = '0 4px 16px rgba(16, 185, 129, 0.3)';
        btn.textContent = '✓ Returned to LiteDaemon';

        var desc = document.getElementById('status-desc');
        desc.innerHTML = 'LiteDaemon is open on your desktop.<br/><span style="display:inline-block; margin-top:8px; font-size:13px; color:var(--gray-600);">Browser blocked auto-closing — press <kbd>Ctrl</kbd> + <kbd>W</kbd> to close this tab.</span>';
      }, 350);
    }

    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';

      // Construct deep link URL with tokens
      deepLink = 'litedaemon://auth/callback' + hash;
      if (search) {
        deepLink += (hash ? '&' : '?') + search.replace(/^\?/, '');
      }

      var openLink = document.getElementById('open-app-link');
      openLink.href = deepLink;

      // Automatically forward tokens to LiteDaemon
      setTimeout(function() {
        if (deepLink) {
          window.location.href = deepLink;
        }
      }, 250);

      // Attempt to close tab and update UI
      setTimeout(function() {
        document.getElementById('status-title').textContent = "You're All Set!";
        document.getElementById('status-desc').innerHTML = 'LiteDaemon is now signed in.<br/><span style="font-size:13px; color:var(--gray-600);">Click below or press <kbd>Ctrl</kbd> + <kbd>W</kbd> to close.</span>';
        openLink.style.display = 'inline-block';

        try { window.close(); } catch(e) {}
        try { window.open('', '_self', ''); window.close(); } catch(e) {}
      }, 1000);
    })();
  </script>

</body>
</html>
